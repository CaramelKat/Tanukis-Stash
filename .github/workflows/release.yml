name: Release iOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xtool
        run: |
          brew tap xtool-org/tap
          brew install --cask xtool-org/tap/xtool

      - name: Install iOS SDK
        run: xtool sdk install /Applications/Xcode.app --slim

      - name: Set app version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          plutil -replace CFBundleShortVersionString -string "$version" Resources/Info.xml
          test "$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.xml)" = "$version"

      - name: Build unsigned release IPA
        run: xtool dev build --configuration release --ipa

      - name: Stage release IPA
        run: |
          ipa=$(find xtool -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          mkdir -p dist
          cp "$ipa" dist/Tanukis-Stash-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Tanukis-Stash-unsigned.ipa --clobber