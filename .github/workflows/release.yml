name: Build iOS app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install xtool
        run: |
          brew tap xtool-org/tap
          brew install --cask xtool-org/tap/xtool

      - name: Install iOS SDK
        run: xtool sdk install /Applications/Xcode.app --slim

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="$major.$minor.$((patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          plutil -replace CFBundleShortVersionString -string "$version" Resources/Info.xml
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.xml

      - name: Build unsigned release IPA
        run: xtool dev build --configuration release --ipa

      - name: Stage release IPA
        run: |
          ipa=$(find xtool -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          mkdir -p dist
          cp "$ipa" dist/Tanukis-Stash-unsigned.ipa

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "$tag" dist/Tanukis-Stash-unsigned.ipa \
            --target "$GITHUB_SHA" --generate-notes
